name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go vet -tags integration ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          working-directory: api
          args: --build-tags integration
      - name: Unit tests
        run: go test -race ./...
      - name: Integration tests (Postgres via testcontainers)
        run: go test -race -tags integration ./...

  generated:
    name: generated templates
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [go, nextjs, nestjs, fastapi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: azure/setup-helm@v4
      - name: Render sample project
        working-directory: api
        run: go run ./cmd/render -runtime ${{ matrix.runtime }} -out "$RUNNER_TEMP/out"
      - name: helm lint (every environment)
        run: |
          for env in dev staging prod; do
            helm lint "$RUNNER_TEMP/out/helm" -f "$RUNNER_TEMP/out/helm/values-$env.yaml"
          done
      - name: kubeconform (every environment)
        run: |
          for env in dev staging prod; do
            helm template demo-service "$RUNNER_TEMP/out/helm" -f "$RUNNER_TEMP/out/helm/values-$env.yaml" \
              | go run github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0 -strict -ignore-missing-schemas -summary
          done
      - name: actionlint generated workflow
        working-directory: ${{ runner.temp }}/out
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/ci.yml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  platform-chart:
    name: platform Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/kuberlaunch
      - run: |
          helm template kuberlaunch deploy/helm/kuberlaunch \
            | go run github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0 -strict -ignore-missing-schemas -summary

  e2e:
    name: e2e on Kind
    runs-on: ubuntu-latest
    needs: [api, generated]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: scripts/e2e.sh
