# External Secrets Operator namespace.
#
# There is intentionally no cluster-wide SecretStore here. Each generated Helm
# chart creates its own namespaced SecretStore that authenticates to Vault with
# Kubernetes auth as <slug>-vault and can read only secret/kuberlauncher/<slug>.
# Run scripts/setup-vault.sh once to enable Kubernetes auth in Vault.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
