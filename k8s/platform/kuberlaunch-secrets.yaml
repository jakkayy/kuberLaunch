# Secrets for the kuberLaunch platform itself, synced from Vault
# (secret/platform/kuberlaunch) by External Secrets into the Secret
# "kuberlaunch-secrets". The Helm chart mounts it at /etc/kuberlaunch/secrets and
# points DB_PASSWORD_FILE, GITHUB_APP_PRIVATE_KEY_PATH, ARGOCD_TOKEN_FILE, ...
# at the files, so no credential lives in env files or Git.
#
# Store the values once:
#   vault kv put secret/platform/kuberlaunch \
#     DB_PASSWORD=... AUTH_JWT_SECRET=... ARGOCD_TOKEN=... GRAFANA_PASSWORD=... \
#     GITHUB_APP_PRIVATE_KEY=@github-app.pem GITHUB_OAUTH_CLIENT_SECRET=... GITHUB_WEBHOOK_SECRET=...
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberlaunch-secrets
  namespace: kuberlaunch
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: kuberlaunch-platform
  namespace: kuberlaunch
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: kuberlaunch-platform-secrets
          serviceAccountRef:
            name: kuberlaunch-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kuberlaunch-secrets
  namespace: kuberlaunch
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: kuberlaunch-platform
    kind: SecretStore
  target:
    name: kuberlaunch-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: platform/kuberlaunch
