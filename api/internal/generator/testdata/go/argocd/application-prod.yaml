apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-service-prod
  namespace: argocd
spec:
  project: demo-service
  source:
    repoURL: https://github.com/acme/demo-service
    targetRevision: HEAD
    path: helm
    helm:
      releaseName: demo-service
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-service-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
