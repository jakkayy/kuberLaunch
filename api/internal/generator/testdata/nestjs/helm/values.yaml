# Defaults shared by every environment. Per-environment overrides, including
# the deployed image tag, live in values-<env>.yaml.
replicaCount: 1

image:
  repository: ghcr.io/acme/demo-service
  pullPolicy: IfNotPresent
  pullSecret: "ghcr-secret"

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: nginx

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env: []

# Secrets are read from Vault path secret/kuberlauncher/demo-service by External
# Secrets, authenticating as a dedicated service account (Vault Kubernetes auth)
# that can read only this project's path.
externalSecret:
  enabled: true
  refreshInterval: 1m
  vault:
    server: http://vault.vault.svc.cluster.local:8200
    authMount: kubernetes
    role: kuberlaunch-demo-service
    serviceAccount: demo-service-vault

monitoring:
  # Requires the Prometheus Operator CRDs (kube-prometheus-stack).
  serviceMonitor: true
  path: /metrics
