{{- if .Values.networkPolicy.enabled }}
# Pods in this namespace (app, database, cache) accept traffic only from each
# other and from the platform namespaces listed in networkPolicy.allowNamespaces
# (ingress controller, Prometheus, the CloudNativePG operator). Egress is open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.allowNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
{{- end }}
