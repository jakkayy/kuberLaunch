{{- if and (eq .Values.database.type "postgres") .Values.database.provision }}
# PostgreSQL managed by the CloudNativePG operator. It creates the Secret
# <release>-db-app whose "uri" key is injected as DATABASE_URL.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-db
  labels:
    app: {{ .Release.Name }}
spec:
  instances: {{ .Values.database.instances }}
  storage:
    size: {{ .Values.database.storage }}
  bootstrap:
    initdb:
      database: app
      owner: app
  resources:
    {{- toYaml .Values.database.resources | nindent 4 }}
{{- end }}
