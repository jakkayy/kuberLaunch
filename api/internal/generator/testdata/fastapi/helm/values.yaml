replicaCount: 1

image:
  repository: ghcr.io/acme/demo-service
  pullPolicy: Always
  tag: "latest"
  pullSecret: "ghcr-secret"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  host: demo-service.local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env: []

# Secrets are read from Vault path secret/kuberlauncher/demo-service by External
# Secrets, authenticating as a dedicated service account (Vault Kubernetes auth)
# that can read only this project's path.
externalSecret:
  enabled: true
  refreshInterval: 1m
  vault:
    server: http://vault.vault.svc.cluster.local:8200
    authMount: kubernetes
    role: kuberlaunch-demo-service
    serviceAccount: demo-service-vault
