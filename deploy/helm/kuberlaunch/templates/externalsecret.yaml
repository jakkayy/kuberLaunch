{{- with .Values.secrets.externalSecret }}
{{- if .enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberlaunch-secrets
  labels: {{- include "kuberlaunch.labels" $ | nindent 4 }}
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: kuberlaunch-platform
  labels: {{- include "kuberlaunch.labels" $ | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .vaultServer | quote }}
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ .vaultRole | quote }}
          serviceAccountRef:
            name: kuberlaunch-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $.Values.secrets.name }}
  labels: {{- include "kuberlaunch.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval }}
  secretStoreRef:
    name: kuberlaunch-platform
    kind: SecretStore
  target:
    name: {{ $.Values.secrets.name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .vaultPath }}
{{- end }}
{{- end }}
